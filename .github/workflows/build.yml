name: Build Packages

on:
  push:
    branches: [main, v2.0]
  pull_request:
    branches: [main, v2.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: ci-linux

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libarchive-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libfontconfig1 \
            libdbus-1-3 \
            libglib2.0-0t64

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Smoke test (kli version)
        run: ./build-ci/src/cli/kli version

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-${{ matrix.name }}-unpackaged
          path: |
            build-ci/src/cli/kli
            build-ci/src/gui/kuiper-imager
          if-no-files-found: error
          retention-days: 14
