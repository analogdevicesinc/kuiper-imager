name: Build Packages

on:
  push:
    branches: [main, v2.0]
  pull_request:
    branches: [main, v2.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: ci-linux
          - name: windows
            os: windows-latest
            preset: ci-windows

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libarchive-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libfontconfig1 \
            libdbus-1-3 \
            libglib2.0-0t64

      # Windows C libraries (libarchive, curl, openssl) come from vcpkg manifest
      # mode via the ci-windows preset's toolchain; only Ninja + MSVC need wiring.
      - name: Set up MSVC + Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./build-ci/src/cli/kli version

      # Assemble a self-contained folder: the exes, the vcpkg C-library DLLs, and
      # (via windeployqt) the Qt DLLs, the Windows platform plugin, and the MSVC
      # runtime. The result runs on a clean Windows host with nothing installed.
      - name: Stage runnable Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-ci/src/cli/kli.exe dist
          Copy-Item build-ci/src/gui/kuiper-imager.exe dist
          Copy-Item build-ci/src/helper/kuiper-imager-helper.exe dist
          $vcpkgBin = "build-ci/vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) { Copy-Item "$vcpkgBin/*.dll" dist }
          Copy-Item build-ci/src/cli/*.dll dist -ErrorAction SilentlyContinue
          Copy-Item build-ci/src/gui/*.dll dist -ErrorAction SilentlyContinue
          windeployqt --release --no-translations --compiler-runtime dist/kli.exe
          windeployqt --release --no-translations --compiler-runtime dist/kuiper-imager.exe
          windeployqt --release --no-translations --compiler-runtime dist/kuiper-imager-helper.exe

      # Prove the bundle is self-contained: run it with PATH stripped to the
      # system dirs, so every dependency must resolve from the bundle itself.
      # list-drives also exercises the real SetupAPI enumeration on the runner.
      - name: Smoke test the Windows bundle (clean PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot;$env:SystemRoot\System32"
          ./dist/kli.exe version
          ./dist/kli.exe list-drives

      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-linux-unpackaged
          path: |
            build-ci/src/cli/kli
            build-ci/src/gui/kuiper-imager
            build-ci/src/helper/kuiper-imager-helper
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-windows
          path: dist/**
          if-no-files-found: error
          retention-days: 14

  package-deb:
    name: package (deb, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Pinned by digest (manifest list) for reproducible, attestable builds — the
    # .deb anchors the distribution's component versions. Refresh deliberately.
    container: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging toolchain + build dependencies
        run: |
          apt-get update
          # Packaging/test tooling; the package build-dependencies themselves come
          # from debian/control via mk-build-deps, so the list stays single-sourced.
          apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            equivs \
            lintian \
            desktop-file-utils \
            xvfb \
            xauth \
            ca-certificates \
            git
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Build binary packages (dpkg-buildpackage)
        run: dpkg-buildpackage -us -uc -b

      - name: Collect packages into the workspace
        run: |
          mkdir -p dist
          mv ../*.deb dist/
          ls -l dist

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/com.analogdevices.kuiperimager.desktop

      - name: Lint packages (lintian, fail on error)
        run: lintian --fail-on error dist/*.deb

      - name: Install built packages (deps only, no Recommends)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./dist/kuiper-imager-cli_*.deb ./dist/kuiper-imager_*.deb

      - name: Smoke test — CLI
        run: kli version

      - name: Smoke test — GUI launches with only declared deps
        run: |
          # Installed without Recommends above, so a successful render proves every
          # runtime dependency (notably the xcb QPA plugin) is declared in Depends.
          xvfb-run -a env QT_QPA_PLATFORM=xcb KUIPER_SHOT=/tmp/shot.png kuiper-imager
          test -s /tmp/shot.png

      - name: Upload .debs
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-deb-${{ matrix.arch }}
          # The two installable packages only; debhelper's auto-generated -dbgsym
          # companions stay out of the published artifact.
          path: |
            dist/*.deb
            !dist/*-dbgsym_*.deb
          if-no-files-found: error
          retention-days: 14
