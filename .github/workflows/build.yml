name: Build Packages

on:
  push:
    branches: [main, v2.0]
  pull_request:
    branches: [main, v2.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: ci-linux

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libarchive-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libfontconfig1 \
            libdbus-1-3 \
            libglib2.0-0t64

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Smoke test (kli version)
        run: ./build-ci/src/cli/kli version

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-${{ matrix.name }}-unpackaged
          path: |
            build-ci/src/cli/kli
            build-ci/src/gui/kuiper-imager
          if-no-files-found: error
          retention-days: 14

  package-deb:
    name: package (deb, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install build + packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            ca-certificates \
            qt6-base-dev \
            libarchive-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            dpkg-dev \
            lintian

      - name: Configure
        run: cmake --preset deb-linux

      - name: Build
        run: cmake --build --preset deb-linux

      - name: Smoke test (kli version)
        run: ./build-deb/src/cli/kli version

      - name: Package (cpack -G DEB)
        working-directory: build-deb
        run: cpack -G DEB

      - name: Lint package (lintian)
        run: lintian build-deb/*.deb || true

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-cli-deb-${{ matrix.arch }}
          path: build-deb/*.deb
          if-no-files-found: error
          retention-days: 14
